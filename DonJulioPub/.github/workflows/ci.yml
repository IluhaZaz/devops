name: Django Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - run: pip install -r requirements.txt
    - run: python don_julio_pub/manage.py migrate
      env:
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: test_db
          DB_PORT: 5432
          DB_HOST: localhost
    - run: python don_julio_pub/manage.py test don_julio_pub.tests
      env:
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: test_db
          DB_PORT: 5432
          DB_HOST: localhost